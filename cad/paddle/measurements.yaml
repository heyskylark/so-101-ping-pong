# Raw measurements of the NIBIRU SPORT paddle (ASIN B098TYG4M5), taken 2026-11-06.
# Lengths in mm, mass in g. Derived quantities live in derived.yaml (generated by derive.py).
#
# Axes used everywhere in cad/paddle/:
#   x: along the paddle, 0 at the butt end of the handle, + toward the blade tip
#   y: across the blade face (width)
#   z: through the blade (thickness), 0 at the blade mid-plane

mass: 151.0

# Balance point along x (paddle balanced flat across an edge). The across-width and
# through-thickness balance points are on the centerline / mid-plane.
balance_point_x: 124.6

overall_length: 250.2   # calipers, butt to tip
blade_max_width: 148.0  # calipers

blade:
  wood_core_thickness: 6.6
  rubber_thickness_per_side: 2.0  # rubber + sponge, both faces
  rubber_start_x: 100.9           # rubber edge nearest the handle, measured from the butt

handle:
  # Calipers. Station s is measured from the blade shoulder (s = 0) toward the butt;
  # the shoulder sits 83 mm from the butt, so x = 83 - s.
  shoulder_x: 83.0
  stations:   # [s, width (y), thickness (z)]
    - [0.0, 29.5, 23.5]
    - [20.0, 26.8, 23.5]
    - [40.0, 27.18, 23.6]
    - [60.0, 30.5, 24.0]
    - [79.0, 33.88, 24.6]
  # Cross-section (photos/handle_end.jpg): rounded rectangle, symmetric about the blade
  # mid-plane; the blade core runs through the middle and the cheeks are glued on each side.
  corner_radius: 8.0  # estimated from the end-on photo, about +-1 mm

# Pencil trace of the outline on US Letter paper (photos/outline_trace.jpg).
# The pencil ran outside the edge; derive.py removes this offset, chosen so the corrected
# blade width matches blade_max_width.
trace:
  photo: photos/outline_trace.jpg
  paper_mm: [215.9, 279.4]
