[build-system]
requires = ["uv_build>=0.8.19,<0.14"]
build-backend = "uv_build"

[project]
name = "pingpong-sim"
version = "0.1.0"
description = "SO-101 + ping pong paddle simulation and RL tasks (mjlab / MuJoCo Warp)"
readme = "README.md"
# better-actuator-models supports only Python 3.12.
requires-python = ">=3.12,<3.13"
dependencies = [
  # Pulls the BAM-tested stack: mjlab 1.3.x, mujoco 3.7, mujoco-warp 3.7, warp-lang 1.12.
  "better-actuator-models[mjlab]==1.0.3",
  "cmaes>=0.13.1",
  "feetech-servo-sdk>=1.0.0",
  "matplotlib>=3.11.2",
  "numpy",
  "onnxruntime>=1.31.1",
  "opencv-python>=5.0.0.93",
  "pyyaml",
]

[tool.uv.build-backend]
module-name = "pingpong_sim"
