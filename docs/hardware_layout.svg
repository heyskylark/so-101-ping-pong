<svg viewBox="0 0 600 330" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" font-size="12" fill="#222">
  <!-- Side view to scale: 400 px per metre, table at y = 290, arm base axis at x = 80. -->
  <rect width="600" height="330" fill="#ffffff"/>
  <line x1="10" y1="290" x2="590" y2="290" stroke="#888" stroke-width="2"/>
  <text x="14" y="306" fill="#777">table</text>
  <rect x="62" y="272" width="36" height="18" fill="#eee" stroke="#222"/>
  <text x="14" y="266">arm base</text>
  <polyline points="80,272 116,150 168,186 205,190" fill="none" stroke="#222" stroke-width="5" stroke-linejoin="round"/>
  <rect x="205" y="187" width="70" height="6" fill="#c0392b"/>
  <text x="196" y="210">blade 0.25 m up</text>
  <circle cx="240" cy="90" r="8" fill="#e67e22"/>
  <line x1="240" y1="99" x2="240" y2="185" stroke="#e67e22" stroke-dasharray="4 4"/>
  <text x="150" y="80">ball apex ~0.25 m above the blade</text>
  <line x1="80" y1="250" x2="240" y2="250" stroke="#777" stroke-dasharray="3 3"/>
  <text x="138" y="245" fill="#555">0.40 m</text>
  <rect x="324" y="78" width="8" height="212" fill="#eee" stroke="#222"/>
  <rect x="300" y="62" width="30" height="12" transform="rotate(65 314 68)" fill="#2c7fb8"/>
  <line x1="310" y1="74" x2="255" y2="190" stroke="#2c7fb8" stroke-dasharray="5 4"/>
  <text x="345" y="66">overhead camera: lens ~0.55 m up,</text>
  <text x="345" y="82">looking back at the blade, 25° from straight down</text>
  <line x1="80" y1="300" x2="328" y2="300" stroke="#777"/>
  <line x1="80" y1="296" x2="80" y2="304" stroke="#777"/>
  <line x1="328" y1="296" x2="328" y2="304" stroke="#777"/>
  <text x="96" y="320" fill="#555">post 0.61 m (24 in) in front of the base axis, straight ahead</text>
</svg>
