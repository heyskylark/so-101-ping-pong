caveats:
- 'Timebase: K = 8 assumed exact (240 fps capture on 30 fps timebase); per-frame PTS used (~15% of capture frames
  are missing). Flight curvatures agree with K = 8 to a few %.'
- 'Scale: S_v from gravity per video at the paddle contact row, with a 1D perspective term when the flights span
  > 15 cm; absolute speeds carry ~1-2% scale uncertainty (S_v vs ball width differ 3-4%).'
- e is a ratio of velocities at the same image location, so it is nearly independent of K and S_v; the drag correction
  raises e by ~0.007 on average and ~0.02 above 2.5 m/s (drag.parabola_bias.measured_drag_minus_nodrag).
- Impact point = intersection of incoming/outgoing flight curves; for fast impacts it lies up to ~15 mm below the
  resting contact row (finite contact time, sponge/ball compression, blade/clamp compliance). Shown as impact_row_offset_mm.
- The paddle is held by a clamp at the handle; blade compliance and vibration after an impact can make e depend
  on the clamp, not only on ball+rubber. Low-speed rebounds (v < 0.6 m/s) happen while the blade may still ring
  from the previous impact and show the largest scatter.
- Impacts are near the blade centre but not exactly at one spot; lateral x velocities are small (see restitution.lateral_drift)
  but depth motion of centre drops is not measured.
- Spin is not measured; hand releases may impart small spin.
- 'Drag: Cd from the 6 ft drops alone is degenerate with camera perspective/scale; the adopted Cd comes from the
  16-25 in paddle drops (max 3.4 m/s), whose fall from 0.64 m reproduces the drag-reduced impact speed (3.4 vs 3.55
  m/s free fall).'
- Release heights are tape-measure nominal; fitted fall heights of the ball centre are given in videos.*.drop_check.
- c-4in videos use a different (closer) camera position; flights are too low to fit the perspective term, so it
  is fixed at 0 there.
